# SPDX-License-Identifier: CC0-1.0
# libcamera software ISP tuning for the S5K4H5YC (rear) (§57.15).
# Not a calibration: values chosen by comparison with a phone's photo of
# the same scene, 26/09.
%YAML 1.1
---
version: 1
algorithms:
  # Pedestal: 64 out of 1023 (4096 at 16 bits), the typical value for
  # Samsung 10-bit sensors, not measured. Stable, unlike the automatic one,
  # which depends on the scenes already framed.
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  # Saturation 2.1 around Rec.601 luminance: rows sum to 1, neutrals stay
  # neutral. No measurable cost on the ISP frame rate.
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [  1.7711, -0.6457, -0.1254,
                 -0.3289,  1.4543, -0.1254,
                 -0.3289, -0.6457,  1.9746 ]
  # Curve: gamma 0.40 and an S-curve (contrast 1.3) instead of the bare
  # gamma 0.5, which in backlight lifts the shadows to a washed-out grey.
  - Lut:
      gamma: 0.4
      contrast: 1.3
  # Highlight protection: above 4% saturated pixels the exposure goes down,
  # as long as the MSV stays above 2.3.
  # binningGain: how much brighter binned mode is than full mode at the same
  # exposure and gain. Measured 1.01 (binning averages): the 8 MP shot
  # starts with the preview exposure (§57.19).
  # flickerPeriod: exposure in multiples of 10 ms, against banding from
  # 50 Hz lights (§57.21).
  - Agc:
      flickerPeriod: 10000
      binningGain: 1.0
      msvMin: 2.3
      saturatedMax: 0.04
  # Usable lens travel: the module EEPROM (0x58, map v001) gives infinity
  # 492 and macro 665 in DAC codes; with a margin of 25% of the range on
  # each side. The driver offers 0-1023 (§57.18).
  - Af:
      lensMin: 450
      lensMax: 710
...
