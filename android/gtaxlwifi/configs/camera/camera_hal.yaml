#
# libcamera Android HAL (§57): location and rotation per camera.
# The id is the one libcamera generates for a sensor described by the device
# tree, the node path under /base. If the DTS declares orientation and
# rotation, those values take precedence and these must match (otherwise the
# HAL warns in the log).

cameras:
  "/base/soc@0/i2c@138c0000/camera@30":
    location: front
    rotation: 270
  "/base/soc@0/i2c@138a0000/camera@37":
    location: back
    rotation: 90
    # SM5703 flash LED (§57): Android torch and flash for photos.
    flash: white:flash
    # The strobe (1200 mA) relative to the torch (150 mA) the AE meters with
    # during pre-flash: the full-resolution shot starts with the exposure
    # reduced accordingly (§57.21).
    flash_gain: 8
    # Preview and video stay in binned mode (1640x1228 minus the debayer
    # borders): larger sizes are offered only as JPEG, captured in a separate
    # full-resolution configuration (§57.19).
    max_stream_size: [1632, 1228]
